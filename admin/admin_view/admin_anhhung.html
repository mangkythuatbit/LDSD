<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Quản lý anh hùng</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="../admin_css/admin.css">
</head>

<body>
  <div class="sidebar">
    <div class="admin_logo">
      <a href="../admin.html"><img src="../BIT-logo-white.png" alt="Logo" class="BIT-logo"></a>
    </div>
    <ul>
      <li><a href="./admin_anhhung.html">Thông tin mẹ VNAH</a></li>
      <li><a href="./admin_btc.html">Thông tin BTC</a></li>
      <li><a href="./admin_sv.html">Thông tin sinh viên</a></li>
      <li><a href="#" id="logout-link">Đăng xuất</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="activity-management">
      <div class="header">
        <h2>QUẢN LÝ <span>MẸ VIỆT NAM ANH HÙNG</span></h2>
        <div id="alert-holder"></div>
        <div class="actions">
          <input type="text" id="admin-search" placeholder="Tìm kiếm ..." aria-label="Tìm kiếm" />
          <div class="button-group">
            <button type="button" class="btn btn-primary add-button" id="add-btn">Thêm mới</button>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Ảnh</th>
              <th>Tên</th>
              <th>Ngày sinh</th>
              <th>Quê quán</th>
              <th>Chiến công</th>
              <th>Ghi chú</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="admin-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Thêm / sửa -->
  <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="form-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="form-title"></h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="record-form">
          <div class="modal-body" id="form-fields"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            <button type="submit" class="btn btn-primary" id="save-btn">Lưu thông tin</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Đăng nhập quản trị -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="login-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <form id="login-form">
          <div class="modal-header"><h1 class="modal-title fs-5" id="login-title">Đăng nhập quản trị</h1></div>
          <div class="modal-body">
            <label for="admin-pw" class="form-label">Mật khẩu</label>
            <input type="password" id="admin-pw" class="form-control" autocomplete="current-password" required>
            <div id="login-error" class="text-danger small mt-2" role="alert"></div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-primary" id="login-btn">Đăng nhập</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="../admin_js/admin.js"></script>
  <script>
    window.ADMIN_CONFIG = {
      "table": "anhhung",
      "pk": "anhhung_id",
      "imgField": "anhhung_img",
      "columns": [
        {
          "key": "anhhung_img",
          "type": "img",
          "label": "Ảnh"
        },
        {
          "key": "anhhung_name",
          "label": "Tên"
        },
        {
          "key": "anhhung_date",
          "type": "date",
          "label": "Ngày sinh"
        },
        {
          "key": "anhhung_home",
          "label": "Quê quán"
        },
        {
          "key": "anhhung_chiencong",
          "label": "Chiến công",
          "long": true
        },
        {
          "key": "anhhung_note",
          "label": "Ghi chú",
          "long": true
        }
      ],
      "fields": [
        {
          "key": "anhhung_name",
          "label": "Tên Mẹ Việt Nam Anh hùng",
          "required": true
        },
        {
          "key": "anhhung_date",
          "label": "Ngày sinh",
          "type": "date",
          "required": true
        },
        {
          "key": "anhhung_home",
          "label": "Quê quán",
          "required": true
        },
        {
          "key": "anhhung_chiencong",
          "label": "Chiến công",
          "type": "textarea"
        },
        {
          "key": "anhhung_note",
          "label": "Ghi chú",
          "type": "textarea"
        }
      ]
    };
  </script>
  <script src="../admin_js/admin-crud.js"></script>
</body>

</html>
