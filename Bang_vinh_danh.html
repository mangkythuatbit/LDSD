<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Vinh danh Mẹ Việt Nam Anh Hùng: Nơi người hùng thầm lặng lên tiếng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/Bang_vinh_danh.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/api.js"></script>
</head>

<body>
    <!-- Header will be loaded dynamically -->
    <div id="header-container"></div>

    <div class="hero-container">
        <section class="hero" style="background: url('./assets/Vinhdanhanhhung.gif') no-repeat center center / cover;">
            <div class="wave-bg"></div>
            <!-- Thêm phần tử audio với controls để kiểm tra -->
<audio id="background-sound"
       src="./assets/Sound_Vinh_danh.mp3"
       preload="auto"
       loop
       autoplay>
    Your browser does not support the audio element.
</audio>
            <h1 class="hero-title">Nơi người hùng thầm lặng lên tiếng</h1>
        </section>

        <div class="chevron-container" id="chevron-up">
            <div class="chevron">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 15l-6-6-6 6" />
                </svg>
            </div>
        </div>

        <div class="content-panel" id="content-panel">
            <section class="section-title">
                <div class="title-banner">BẢNG VINH DANH</div>
            </section>

            <section class="heroes-container">
                <h3 class="heroes-subtitle">NGƯỜI MẸ VIỆT NAM ANH HÙNG</h3>

                <!-- Nút điều hướng trái -->
                <button class="arrow-btn left-btn">&#10094;</button>

                <!-- Wrapper cho carousel -->
                <div class="heroes-carousel-wrapper">
                    <div class="heroes-grid" id="heroes-grid">
                        <!-- Thẻ Mẹ VNAH được dựng bằng JS từ Google Sheets (sheet "anhhung") -->
                    </div>
                </div>

                <!-- Nút điều hướng phải -->
                <button class="arrow-btn right-btn">&#10095;</button>
            </section>

                <!-- Footer will be loaded dynamically -->
                <div id="footer-container"></div>



        </div>
    </div>


    <script>
    // Thay cho vòng lặp PHP: lấy dữ liệu từ Google Sheets rồi dựng thẻ, sau đó báo cho carousel khởi động
    (function () {
        var grid = document.getElementById('heroes-grid');
        function ready() { window.__heroesReady = true; document.dispatchEvent(new Event('heroes:ready')); }
        BIT.apiList('anhhung').then(function (rows) {
            if (!rows.length) { grid.innerHTML = '<p class="heroes-empty">Chưa có dữ liệu để hiển thị.</p>'; return; }
            grid.innerHTML = rows.map(function (r) {
                return '<a href="./ModelViews/Component_khac/Me_VNAH_chitiet.html?id=' + encodeURIComponent(r.anhhung_id) + '" class="hero-card-link">' +
                    '<div class="hero-card">' +
                    '<img src="' + BIT.esc(BIT.imgSrc('anhhung', r.anhhung_img)) + '" alt="Mẹ VNAH" loading="lazy">' +
                    '<div class="hero-card-info">' +
                    '<div class="hero-card-name">Mẹ ' + BIT.esc(r.anhhung_name) + '</div>' +
                    '<div class="hero-card-year">Sinh vào ' + BIT.esc(BIT.fmtDate(r.anhhung_date, 'chưa rõ')) + '</div>' +
                    '<div class="hero-card-location">' + BIT.esc(r.anhhung_home) + '</div>' +
                    '</div></div></a>';
            }).join('');
        }).catch(function (e) {
            console.error(e);
            grid.innerHTML = '<p class="heroes-empty">Không tải được dữ liệu. Vui lòng tải lại trang.</p>';
        }).then(ready);
    })();
    </script>

    <script src="../assets/js/Bang_vinh_danh.js" defer></script>
</body>

</html>
